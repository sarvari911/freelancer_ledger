AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Freelancer Ledger Local Infrastructure

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,x-user-id,Authorization'"
      AllowOrigin: "'*'"
  Function:
    Timeout: 10
    Runtime: nodejs18.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        CLIENTS_TABLE: freelancer-ledger-clients-local
        INVOICES_TABLE: freelancer-ledger-invoices-local
        PAYMENTS_TABLE: freelancer-ledger-payments-local
        PDF_BUCKET: freelancer-ledger-pdfs-local
        OPENSEARCH_ENDPOINT: http://host.docker.internal:9200
        S3_ENDPOINT: http://host.docker.internal:4566
        
Resources:
  # --- DYNAMODB TABLES ---
  ClientsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: freelancer-ledger-clients-local
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: clientId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: clientId
          KeyType: RANGE

  InvoicesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: freelancer-ledger-invoices-local
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: invoiceId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: invoiceId
          KeyType: RANGE

  PaymentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: freelancer-ledger-payments-local
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: paymentId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: paymentId
          KeyType: RANGE

  # --- LAMBDA FUNCTIONS ---
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: health.handler
      Events:
        HealthApi:
          Type: Api
          Properties:
            Path: /health
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        EntryPoints:
          - health.ts

  ClientsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: clients.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ClientsTable
      Events:
        GetClients:
          Type: Api
          Properties:
            Path: /clients
            Method: get
        CreateClient:
          Type: Api
          Properties:
            Path: /clients
            Method: post
        GetClient:
          Type: Api
          Properties:
            Path: /clients/{clientId}
            Method: get
        DeleteClient:
          Type: Api
          Properties:
            Path: /clients/{clientId}
            Method: delete
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        EntryPoints:
          - clients.ts

  InvoicesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: invoices.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref InvoicesTable
      Events:
        CreateInvoice:
          Type: Api
          Properties:
            Path: /clients/{clientId}/invoices
            Method: post
        GetClientInvoices:
          Type: Api
          Properties:
            Path: /clients/{clientId}/invoices
            Method: get
        GetInvoice:
          Type: Api
          Properties:
            Path: /invoices/{invoiceId}
            Method: get
        UpdateInvoice:
          Type: Api
          Properties:
            Path: /invoices/{invoiceId}
            Method: put
        DeleteInvoice:
          Type: Api
          Properties:
            Path: /invoices/{invoiceId}
            Method: delete
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        EntryPoints:
          - invoices.ts

  PaymentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: payments.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PaymentsTable
        - DynamoDBReadPolicy:
            TableName: !Ref InvoicesTable
      Events:
        CreatePayment:
          Type: Api
          Properties:
            Path: /invoices/{invoiceId}/payments
            Method: post
        GetPayments:
          Type: Api
          Properties:
            Path: /invoices/{invoiceId}/payments
            Method: get
        DeletePayment:
          Type: Api
          Properties:
            Path: /payments/{paymentId}
            Method: delete
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        EntryPoints:
          - payments.ts

  LedgerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: ledger.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref InvoicesTable
        - DynamoDBReadPolicy:
            TableName: !Ref PaymentsTable
      Events:
        GetLedger:
          Type: Api
          Properties:
            Path: /clients/{clientId}/ledger
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        EntryPoints:
          - ledger.ts

  SearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: search.handler
      Events:
        SearchInvoices:
          Type: Api
          Properties:
            Path: /search/invoices
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        EntryPoints:
          - search.ts

  PdfFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: pdf.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref InvoicesTable
        - S3CrudPolicy:
            BucketName: freelancer-ledger-pdfs-local
      Events:
        GeneratePdf:
          Type: Api
          Properties:
            Path: /invoices/{invoiceId}/pdf
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        EntryPoints:
          - pdf.ts

  OverdueScanFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: overdue.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref InvoicesTable
        - DynamoDBReadPolicy:
            TableName: !Ref PaymentsTable
      Events:
        RunOverdueScan:
          Type: Api
          Properties:
            Path: /invoices/overdue-scan
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        EntryPoints:
          - overdue.ts